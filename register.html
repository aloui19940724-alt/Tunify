<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - Tunify</title>

<link rel="stylesheet" href="style.css">

<style>
.auth-container{
max-width:400px;
margin:100px auto;
background:#181818;
padding:30px;
border-radius:15px;
}

.auth-container h2{
text-align:center;
margin-bottom:20px;
color:#ff7a00;
}

.auth-container input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#222;
color:white;
}

.auth-container button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#ff7a00;
color:white;
font-size:16px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="auth-container">

<h2>إنشاء حساب</h2>

<input
id="name"
placeholder="الاسم الكامل">

<input
id="email"
type="email"
placeholder="البريد الإلكتروني">

<input
id="password"
type="password"
placeholder="كلمة المرور">

<button onclick="registerUser()">
إنشاء الحساب
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function registerUser(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const { error } =
await supabaseClient.auth.signUp({
email,
password
});

if(error){

alert(error.message);

return;
}

alert("تم إنشاء الحساب بنجاح");

window.location.href="login.html";

}

</script>

</body>
</html>
