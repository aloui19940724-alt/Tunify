<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunify</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- القائمة الجانبية -->

    <div id="sidebar" class="sidebar">

        <div class="sidebar-header">
            <h2>التصنيفات</h2>
        </div>

        <ul>
            <li>جميع المنتجات</li>
            <li>الألعاب</li>
            <li>الاشتراكات</li>
            <li>الخدمات الرقمية</li>
            <li>البطاقات الرقمية</li>
            <li>العروض</li>
        </ul>

    </div>

    <!-- الهيدر -->

    <header>

        <button id="menuBtn">☰</button>

        <div class="logo">
            Tunify
        </div>

        <div class="header-actions">
            <button onclick="window.location.href='cart.html'">🛒</button>
            <button onclick="window.location.href='login.html'">👤</button>
        </div>

    </header>

    <!-- بانر -->

    <section class="hero">

        <h1>مرحباً بك في Tunify</h1>

        <p>
            أفضل منصة عربية للمنتجات والخدمات الرقمية
        </p>

    </section>

    <!-- المنتجات -->

    <section class="products">

        <h2>المنتجات المميزة</h2>

        <div class="products-grid">

            <div class="product-card">

                <img src="https://via.placeholder.com/300x200" alt="منتج">

                <h3>اشتراك ChatGPT Go</h3>

                <p class="price">30 د.ت</p>

                <button>عرض المنتج</button>

            </div>

            <div class="product-card">

                <img src="https://via.placeholder.com/300x200" alt="منتج">

                <h3>بطاقة ألعاب</h3>

                <p class="price">50 د.ت</p>

                <button>عرض المنتج</button>

            </div>

            <div class="product-card">

                <img src="https://via.placeholder.com/300x200" alt="منتج">

                <h3>خدمة رقمية</h3>

                <p class="price">80 د.ت</p>

                <button>عرض المنتج</button>

            </div>

        </div>

    </section>

    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <!-- ملفات الموقع -->

    <script src="app.js"></script>

</body>

</html>
